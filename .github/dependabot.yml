# Dependabot keeps dependencies current and flags vulnerable ones.
# PR prefixes match the repo's Conventional Commits policy (build/ci).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /engine-ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

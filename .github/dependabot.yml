# Dependabot config. PR prefixes match the repo's Conventional Commits policy.
#
# BETA FREEZE (2026-06): version updates are paused via open-pull-requests-limit: 0
# on every ecosystem. Dependencies do not change right before a release; the app
# and engine are verified green on their current pinned versions. Security
# updates are unaffected by the 0 limit and still flow once Dependabot security
# alerts are enabled in repo settings. After beta ships, restore the limits to 5
# and take all bumps in one deliberate, verified dependency pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /engine-ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

name: CLA

# Every contribution needs a signed Contributor License Agreement (CLA.md) before it
# can merge. The agreement grants the Licensor the right to relicense contributions,
# which is what keeps the commercial license in COMMERCIAL.md sellable over the whole
# work. Without this gate the agreement is decorative.
#
# Contributors sign by commenting the sign-off line on their pull request. The
# signature is recorded once per GitHub account and covers all future contributions.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Wider than the read-only floor in ci.yml, and deliberately so: the action writes the
# signature file, comments on the pull request, and sets the check status. The elevated
# token is safe here because `pull_request_target` runs the workflow definition from
# the base branch and this job never checks out or executes pull-request code. Nothing
# a contributor can write reaches this token.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "CLA gate"
        # Only act on the two signing phrases, or on pull-request events. Every other
        # comment on every other issue is ignored without starting the action.
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on their own branch so the history of main stays content
          # and code only. The branch is created on the first signature.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/pinaka-cognitive-systems/pinaka-abhyas/blob/main/CLA.md
          # The copyright holder and bots do not sign.
          allowlist: 5h1vmani,dependabot[bot],bot*
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed by all contributors. Thank you.
          custom-notsigned-prcomment: |
            Thanks for the contribution. Before it can merge, please sign the
            [Contributor License Agreement](https://github.com/pinaka-cognitive-systems/pinaka-abhyas/blob/main/CLA.md).

            It exists so the project can stay free for students while businesses that
            monetise it pay for a commercial license. You keep your copyright; you are
            granting an additional license alongside it. Read `CLA.md` for the detail.

            To sign, post a new comment on this pull request with the one-line
            sign-off given under "How to sign" in `CLA.md`. Copy it exactly.

            Signing is once per GitHub account. You will not be asked again.

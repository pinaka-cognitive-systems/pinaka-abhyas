name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the superseded run, so verdicts and
# failure emails always refer to the current state of the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (CodeQL actions/missing-workflow-permissions): the default
# GITHUB_TOKEN scope is broad. Every job here only reads the repo; none pushes,
# comments, or deploys. Same-run artifact upload and download are authorized by
# the run token regardless of this block. Set the floor once for all jobs.
permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: "Hygiene: no absolute home paths in tracked files"
        run: |
          PAT="/Use""rs/"
          if git grep -In "$PAT" -- ':!*.lock' ':!package-lock.json'; then
            echo "Tracked files contain absolute home paths."; exit 1
          fi

      - name: "Tier 1: schema meta-validation and fixtures"
        run: python3 schema/validate.py

      - name: "Tier 2: cross-record pack checks"
        run: python3 schema/validator/run_checks.py

      - name: "Solution harness: sandboxed key execution"
        run: python3 schema/validator/run_solutions.py packs/ca-foundation-qa

      - name: "Tests: validator"
        run: python3 -m pytest schema/validator/tests -q

      - name: "Build the pack artifact (consumed by the app job)"
        run: python3 packs/ca-foundation-qa/build_and_validate.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ca-pack
          path: |
            packs/ca-foundation-qa/pack.json
            packs/ca-foundation-qa/pack.manifest.json
          retention-days: 1

  quality-report:
    name: Content quality report (advisory, never blocks merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: "Advisory: content quality and assembly dry-run"
        run: python3 schema/validator/run_quality.py

  engine-ts:
    name: Engine (TypeScript) typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json

      - name: Install
        run: npm ci
        working-directory: engine-ts

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: engine-ts

      - name: Tests
        run: npx vitest run
        working-directory: engine-ts

      # W1-12 independent cross-check (ADR 0010): the Python twin of the
      # mastery math, regenerated and compared on every run. Stdlib-only
      # Python; the runner's system python3 is enough.
      - name: Cross-check (W1-12)
        run: crosscheck/run_compare.sh

      # Dependency advisories: fail on new ones, allowlist the reviewed dev-only
      # ones (tools/audit-gate.mjs carries the reasons). Last so it never masks
      # a functional failure above it.
      - name: "Dependency audit gate"
        run: npm run audit
        working-directory: engine-ts

  app:
    name: App (PWA scaffold) typecheck, lint, test, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The app consumes the validated pack artifact: pack.json is generated, never
    # tracked, so CI must hand the exact validator-passed build to the app job
    # (a gitignored artifact satisfying local runs hid this dependency).
    needs: validate-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ca-pack
          path: packs/ca-foundation-qa/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          # Lock file lives in app/; the file: dep on ../engine-ts resolves as a
          # symlink at install time and needs no separate engine-ts install step.
          cache-dependency-path: app/package-lock.json

      - name: "Install: app dependencies"
        run: npm ci
        working-directory: app

      - name: Typecheck
        run: npm run typecheck
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

      - name: Tests
        run: npm test
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: "Size check: enforce ADR 0008 byte budget"
        run: npm run check-size
        working-directory: app

      - name: "Offline check: every precached shell asset resolves (W5-4)"
        run: npm run check-offline
        working-directory: app

      - name: "Accessibility: contrast, type floor, touch targets, focus, motion (W5-6)"
        run: npm run check-a11y
        working-directory: app

      # Dependency advisories: fail on new ones, allowlist the reviewed dev-only
      # ones (tools/audit-gate.mjs carries the reasons). Last so it never masks
      # a functional failure above it.
      - name: "Dependency audit gate"
        run: npm run audit
        working-directory: app

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport: width=device-width is required for the 360px floor (ADR 0011).
      initial-scale=1 prevents iOS Safari's default shrink-to-fit.
      viewport-fit=cover extends into the safe-area-inset on notched devices.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      theme-color: brand primary (updated from #6366F1 to #5558E8 per W5-6 contrast
      fix; matches the --color-brand-primary token after the WCAG AA correction).
    -->
    <meta name="theme-color" content="#5558e8" />
    <!--
      apple-mobile-web-app-capable: opt the installed PWA into standalone mode on
      iOS so the system chrome is hidden and the viewport is the full screen. This
      is the iOS equivalent of display: standalone in the web manifest.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      apple-mobile-web-app-status-bar-style: default keeps the status bar light.
      black-translucent would let the app extend under it (needs extra top padding).
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      apple-mobile-web-app-title: short name shown under the icon on the home screen.
      Matches the short_name in the web manifest.
    -->
    <meta name="apple-mobile-web-app-title" content="Pinaka Abhyas" />
    <!--
      Icons: the brand chevron-mark (design-team/v2 app-shell). favicon.svg is
      the primary tab icon; favicon-32.png covers Safari and legacy browsers.
      PNGs are generated by scripts/make-icons.py — edit the mark there, not
      by hand. Whole set is ~11 KB, well inside the ADR 0008 byte budget.
    -->
    <!--
      Preload the sans subset: every visible string uses it, so fetching it
      alongside the bundle avoids the font-display swap reflow on first paint.
      crossorigin is mandatory for font preloads even same-origin.
    -->
    <link rel="preload" href="/fonts/PlexSansVar.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pinaka Abhyas</title>
  </head>
  <body>
    <!-- React mounts here. id="root" is referenced by src/main.tsx. -->
    <div id="root"></div>
    <!--
      type="module" tells the browser this is an ES module; Vite replaces this
      with the compiled bundle in the production build.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
